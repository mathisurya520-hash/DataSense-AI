<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Portal Authentication - DataSense AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      width: 440px;
      max-width: 100%;
      border-radius: var(--radius-lg);
      padding: 40px 35px;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid rgba(232, 223, 200, 0.1);
      margin-bottom: 30px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-weight: 600;
      font-size: 15px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all var(--transition-fast);
    }
    .auth-tab.active {
      color: var(--highlight-yellow);
      border-bottom-color: var(--highlight-yellow);
    }
    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="glass-card auth-card">
      <div style="display: flex; align-items: center; justify-content:center; gap: 8px; margin-bottom: 30px;">
        <i class="logo-icon" data-lucide="database" style="color:var(--highlight-yellow); font-size:24px;"></i>
        <span class="logo-text" style="font-size:20px; font-weight:700;">DataSense <span style="color:var(--accent-jade)">AI</span></span>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
        <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Create Account</div>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@company.com" required>
        </div>
        <div class="form-group" style="margin-bottom: 25px;">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; border-radius: var(--radius-md);">
          Authorize Access <i data-lucide="arrow-right"></i>
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="register-username" class="form-control" placeholder="lead_analyst" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="register-email" class="form-control" placeholder="name@company.com" required>
        </div>
        <div class="form-group" style="margin-bottom: 25px;">
          <label class="form-label">Password</label>
          <input type="password" id="register-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px; border-radius: var(--radius-md);">
          Initialize Portal <i data-lucide="user-plus"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Shared canvas background wrapper -->
  <div id="background-canvas-container"></div>

  <script src="/js/state.js"></script>
  <script src="/js/background.js"></script>
  <script src="/js/mockData.js"></script>
  
  <script>
    function switchTab(type) {
      document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(el => el.classList.remove('active'));
      
      if (type === 'login') {
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || 'Authentication failed');
        }

        DataSenseState.showToast('Authentication approved. Launching dashboard...');
        
        // Save state and redirect
        setTimeout(async () => {
          // Initialize user storage token
          localStorage.setItem(DataSenseState.TOKEN_KEY, data.token);
          localStorage.setItem(DataSenseState.USER_KEY, data.username);
          
          // Seed database if empty
          await MockTemplates.seedIfEmpty();
          
          window.location.href = '/dashboard.html';
        }, 1000);

      } catch (err) {
        DataSenseState.showToast(err.message, 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('register-username').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || 'Registration failed');
        }

        DataSenseState.showToast('Account initialized. Seeding database metrics...');
        
        setTimeout(async () => {
          // Setup token
          localStorage.setItem(DataSenseState.TOKEN_KEY, data.token);
          localStorage.setItem(DataSenseState.USER_KEY, data.username);
          
          // Seed data
          await MockTemplates.seedIfEmpty();
          
          window.location.href = '/dashboard.html';
        }, 1500);

      } catch (err) {
        DataSenseState.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
